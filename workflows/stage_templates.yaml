# Reusable workflow stage templates for dynamic planning.
# The DynamicPlanner assembles a workflow from these based on the goal:
# simple requests get only the stages they need; major projects can still
# request the full 0→100 pipeline. Each template maps to an agent role and
# carries an executable instruction (PLANNED_TOOL_CALLS AUTO artifacts).

understanding:
  name: Understanding
  agent_role: executive
  description: >
    Restate the goal, the decision it informs and the success criteria.
    Write to artifacts/understanding.md.
    PLANNED_TOOL_CALLS: [{"tool":"filesystem.write","args":{"path":"artifacts/understanding.md","content":"AUTO"}}]

research:
  name: Research
  agent_role: research-director
  description: >
    Gather evidence about the goal: signals, risks, open questions.
    Write to artifacts/research.md.
    PLANNED_TOOL_CALLS: [{"tool":"filesystem.write","args":{"path":"artifacts/research.md","content":"AUTO"}}]

community:
  name: Community Intelligence
  agent_role: community-researcher
  description: >
    Pain points, feature requests, buying signals and unmet demand from
    communities. Write to artifacts/community.md.
    PLANNED_TOOL_CALLS: [{"tool":"filesystem.write","args":{"path":"artifacts/community.md","content":"AUTO"}}]

requirements:
  name: Requirements
  agent_role: requirements-analyst
  description: >
    Extract precise, testable requirements and acceptance criteria.
    Write to artifacts/requirements.md.
    PLANNED_TOOL_CALLS: [{"tool":"filesystem.write","args":{"path":"artifacts/requirements.md","content":"AUTO"}}]

design:
  name: Design
  agent_role: design-director
  description: >
    Design direction: flows, hierarchy, accessibility, quality bar.
    Apply the ui-excellence skill: pick the type pairing, color token set,
    8px spacing scale and ONE signature visual element; record the system in
    the design doc so the build stages follow it. Write to artifacts/design.md.
    PLANNED_TOOL_CALLS: [{"tool":"filesystem.write","args":{"path":"artifacts/design.md","content":"AUTO"}}]

implement-frontend:
  name: Frontend Implementation
  agent_role: frontend-lead
  description: >
    Build the actual frontend. Tools like filesystem.write ARE available to
    you (plus context7 for framework docs) — use them when they help. The
    simplest reliable path is: do not read files — the mission, requirements
    AND the full design direction are already in your task context below
    (=== WORK COMPLETED SO FAR ===). Put the deliverable directly in your
    FINAL ANSWER — you may not end the stage by saying you will read files
    first. Your
    FINAL ANSWER must be the COMPLETE landing page as raw HTML source: a
    single self-contained page with inline CSS and any JavaScript it needs,
    selling the product from the mission — polished hero, features,
    how-it-works, CTA. Nothing but the HTML in your final answer.
    MAX_TOKENS: 16000
    PLANNED_TOOL_CALLS: []

implement-backend:
  name: Backend Implementation
  agent_role: backend-lead
  description: >
    Build the working demo. Tools like filesystem.write ARE available to
    you (plus context7 for framework docs) — use them when they help. The
    simplest reliable path is: do not read files — the mission, requirements
    AND the full design direction are already in your task context below
    (=== WORK COMPLETED SO FAR ===). Put the deliverable directly in your
    FINAL ANSWER — you may not end the stage by saying you will read files
    first. Your FINAL
    ANSWER must be the COMPLETE interactive demo as raw HTML source: a single
    self-contained page with inline CSS and real JavaScript that simulates
    the product from the mission — a shared team room where several humans
    and several AI agents collaborate on one goal: people typing, agents
    responding, work being delegated, artifacts appearing. Make it feel
    alive. Nothing but the HTML in your final answer.
    MAX_TOKENS: 16000
    PLANNED_TOOL_CALLS: []

testing:
  name: Testing
  agent_role: test-engineer
  description: >
    Run tests against the implementation and report actual results. Write
    to artifacts/tests.md.
    PLANNED_TOOL_CALLS: [{"tool":"filesystem.write","args":{"path":"artifacts/tests.md","content":"AUTO"}}]

security:
  name: Security Review
  agent_role: security-reviewer
  description: >
    Review for secrets, injection, unsafe operations and excessive
    permissions. Write findings to artifacts/security.md.
    PLANNED_TOOL_CALLS: [{"tool":"filesystem.write","args":{"path":"artifacts/security.md","content":"AUTO"}}]

review:
  name: Review
  agent_role: code-reviewer
  description: >
    Review the implementation against requirements and the quality bar.
    Write structured findings to artifacts/review.md.
    PLANNED_TOOL_CALLS: [{"tool":"filesystem.write","args":{"path":"artifacts/review.md","content":"AUTO"}}]

deploy:
  name: Deployment
  agent_role: deployment-agent
  description: >
    Deploy the built site: call deploy.github to push the workspace files to
    the deployment repo (it creates one per project if none is set), then
    render.manage create to spin up a Render static site from that repo
    (autoDeploy on push). GITHUB_TOKEN + RENDER_API_KEY + RENDER_OWNER must be
    configured. NEVER touch Bellam & Kaaram or QueSnack — they are protected.
    If keys are missing, note it in the report instead. Write the deployment
    report to artifacts/deploy.md.
    PLANNED_TOOL_CALLS: [{"tool":"filesystem.write","args":{"path":"artifacts/deploy.md","content":"AUTO"}}]
  requires_approval: false

report:
  name: Final Report
  agent_role: executive
  description: >
    Synthesize the run into a final report: outcome, artifacts, next steps.
    Write to artifacts/final-report.md.
    PLANNED_TOOL_CALLS: [{"tool":"filesystem.write","args":{"path":"artifacts/final-report.md","content":"AUTO"}}]