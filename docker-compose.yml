# Agent OS — local stack
#   docker compose up --build -d
#   open http://localhost:8300
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos
      POSTGRES_DB: agentos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://agentos:agentos@postgres:5432/agentos
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_DIR: /data/workspace
      MATTERMOST_URL: ${MATTERMOST_URL:-}
      MATTERMOST_TOKEN: ${MATTERMOST_TOKEN:-}
      MATTERMOST_TEAM: ${MATTERMOST_TEAM:-ai-agency}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
    ports:
      - "8300:8300"
    volumes:
      - agentos-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "agentos.api.server:app", "--host", "0.0.0.0", "--port", "8300"]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://agentos:agentos@postgres:5432/agentos
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_DIR: /data/workspace
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
    volumes:
      - agentos-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # the Dockerfile HEALTHCHECK probes the API port, which the worker does
    # not serve — override it so the worker reports healthy while alive
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f agentos.worker || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    command: ["sh", "/app/docker/entrypoint-worker.sh"]

volumes:
  pgdata:
  agentos-data: